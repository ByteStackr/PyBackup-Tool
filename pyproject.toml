[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "PyBackup-Tool"
dynamic = ["version"]
description = "Zero-dependency backup tool for codebases: verified archives, safe restore, project config files"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "ByteStackr", email = "229177070+ByteStackr@users.noreply.github.com"}]
maintainers = [{name = "ByteStackr", email = "229177070+ByteStackr@users.noreply.github.com"}]
keywords = ["backup", "cli", "tool", "zero-dependency", "configuration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities"
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/ByteStackr/PyBackup-Tool"
"Bug Tracker" = "https://github.com/ByteStackr/PyBackup-Tool/issues"
"Repository" = "https://github.com/ByteStackr/PyBackup-Tool.git"
"Documentation" = "https://github.com/ByteStackr/PyBackup-Tool#readme"

[project.scripts]
pybackup-tool = "pybackuptool.cli:main"
PyBackup-Tool = "pybackuptool.cli:main"

[tool.setuptools]
packages = ["pybackuptool"]
py-modules = ["PyBackup_Tool"]

[tool.setuptools.dynamic]
version = {attr = "pybackuptool.__version__"}
